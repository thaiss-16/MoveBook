<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Listas</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="/assets/css/style.css?v=1.2">
    </head>
    <body class="fondo-lila py-5">

        <h1 class="text-center fw-bold display-4 mb-4 texto-lila">Listas de Tareas y Notas</h1>

        <div class="container" id="listas">
            <div class="row justify-content-center">
                <div class="col-12 col-md-11 col-lg-10">
                    
                    <div class="card shadow-lg border-0 rounded-4 mb-4">
                        <div class="card-body p-4 p-md-5">
                            
                            <div class="d-flex justify-content-between align-items-center mb-5">
                                <button id="btn_volver" class="btn btn-outline-secondary fw-bold px-4 py-2 rounded-3 shadow-sm">
                                    Volver al Calendario
                                </button>
                            </div>

                            <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 g-4" id="contenedor-bloques-notas">
                                
                                <div class="col">
                                    <button id="btn_agregar_lista" data-bs-toggle="modal" data-bs-target="#modalLista" class="btn btn-outline-lila w-100 h-100 d-flex flex-column align-items-center justify-content-center p-4 rounded-4 shadow-sm border-2 text-decoration-none" style="min-height: 160px;">
                                        <span class="display-4 fw-normal mb-1">+</span>
                                        <span class="fw-bold small text-uppercase tracking-wider">Nueva Nota</span>
                                    </button>
                                </div>

                                {% for fila in listas %}
                                    <div class="col">
                                        <button id="nota-{{ fila[0] }}" class="btn btn-lista-bloque btn-lila w-100 h-100 d-flex align-items-center justify-content-center p-3 rounded-4 shadow-sm fw-bold fs-5 text-center break-word" data-id="{{ fila[0] }}" style="min-height: 160px;">
                                            {{ fila[1] }}
                                        </button>
                                    </div>
                                {% endfor %}

                            </div> 

                            {% if listas|length == 0 %}
                                <div class="text-center mt-5 py-4">
                                    <p class="text-muted fs-5 mb-0">No tienes listas todavía. ¡Toca el cuadro del <b>(+)</b> para crear tu primera nota!</p>
                                </div>
                            {% endif %}

                        </div>
                    </div> 
                </div>
            </div>
        </div>

        <div id="modalLista" class="modal fade" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 rounded-4 shadow">
                    <div class="modal-header border-0 pt-4 px-4 pb-0">
                        <h2 class="fw-bold texto-lila mb-0">Nueva Lista</h2>
                        <button type="button" id="btn_cerrar_modal" data-bs-dismiss="modal" class="btn-close" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <form id="formNuevaLista">
                            <div class="mb-3">
                                <label for="titulo_lista" class="form-label fw-semibold text-secondary">Título de la lista:</label>
                                <input type="text" id="titulo_lista" class="form-control form-control-lg input-lila" required placeholder="Ej: Compras del supermercado">
                            </div>
                            <div class="mb-4">
                                <label for="contenido_lista" class="form-label fw-semibold text-secondary">Contenido / Tareas:</label>
                                <textarea id="contenido_lista" class="form-control input-lila" rows="10" required placeholder="Escribe tus notas o elementos aquí..."></textarea>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-lila btn-lg fw-bold py-2 shadow-sm rounded-3">Guardar Lista</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div id="modalVerLista" class="modal fade" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content border-0 rounded-4 shadow">
                    <div class="modal-header border-0 pt-4 px-4 pb-0">
                        <h2 id="ver_titulo_pantalla" class="fw-bold text-secondary mb-0">Detalles de la Lista</h2>
                        <button type="button" id="btn_cerrar_ver" data-bs-dismiss="modal" class="btn-close" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <form id="formEditarLista">
                            <input type="hidden" id="ver_id_lista">
                            
                            <div class="mb-3">
                                <label for="ver_titulo_lista" class="form-label fw-semibold text-secondary">Título de la lista:</label>
                                <input type="text" id="ver_titulo_lista" class="form-control form-control-lg input-lila" required readonly>
                            </div>
                            <div class="mb-4">
                                <label for="ver_contenido_lista" class="form-label fw-semibold text-secondary">Contenido / Tareas:</label>
                                <textarea id="ver_contenido_lista" class="form-control input-lila" rows="10" required readonly></textarea>
                            </div>
                            
                            <div class="d-flex flex-wrap gap-2 justify-content-end">
                                <button type="button" id="btn_editar_opcion" class="btn btn-lila fw-bold px-4 py-2 rounded-3 shadow-sm">Editar Lista</button>
                                <button type="button" id="btn_eliminar_opcion" class="btn btn-danger fw-bold px-4 py-2 rounded-3 shadow-sm">Eliminar Lista</button>
                                <button type="button" id="btn_cancelar_ver" data-bs-dismiss="modal" class="btn btn-secondary fw-semibold px-4 py-2 rounded-3">Cerrar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>      

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/assets/js/gestion-listas.js"></script>
    </body>
</html>

<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Iniciar sesion</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="/assets/css/style.css?v=1.2">
    </head>
    <body class="fondo-lila vh-100 d-flex align-items-center justify-content-center">

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-11 col-md-7">
                    
                    <div class="card shadow-lg border-0 rounded-5">
                        <div class="card-body p-4 p-md-5">
                            
                            <h1 class="text-center fw-bold mb-5 texto-lila display-5">¡Inicia Sesión en MoveBook!</h1>
                            
                            <form action="" id="log">
                                
                                <div class="mb-4">
                                    <label class="form-label fw-semibold text-secondary fs-5">Su usuario:</label>
                                    <input type="text" maxlength="25" name="username" class="form-control form-control-lg input-lila" placeholder="Nombre de usuario" required>
                                </div>
                                
                                <div class="mb-5">
                                    <label class="form-label fw-semibold text-secondary fs-5">Su contraseña:</label>
                                    <input type="password" maxlength="25" name="password" class="form-control form-control-lg input-lila" placeholder="••••••••" required>
                                </div> 
                                
                                <div class="d-grid mb-4">
                                    <button type="submit" class="btn btn-lila btn-lg fw-bold shadow-sm py-3 fs-4 rounded-3">Ingresar</button>
                                </div>
                            </form>
                            
                            <div class="text-center mt-4 fs-5">
                                <span class="text-muted">¿No tienes cuenta? </span>
                                <a href="registro" class="text-decoration-none fw-semibold enlace-lila">Regístrate aquí</a>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/assets/js/log.js"></script>
    </body>
</html>
